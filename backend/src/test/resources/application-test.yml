spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///sentinelflow
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: dummy:9092
    listener:
      auto-startup: false

sentinelflow:
  kafka:
    enabled: false
